<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Main Badge Icon -->
  <g filter="url(#shadow)">
    <!-- Document background shape -->
    <rect x="116" y="96" width="280" height="320" rx="32" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="8"/>
    
    <!-- Top folded corner decor -->
    <path d="M336 96 L396 156 L336 156 Z" fill="url(#primaryGrad)"/>

    <!-- Document Lines -->
    <rect x="156" y="160" width="130" height="16" rx="8" fill="url(#accentGrad)"/>
    <rect x="156" y="196" width="200" height="12" rx="6" fill="#475569"/>
    <rect x="156" y="224" width="170" height="12" rx="6" fill="#475569"/>
    <rect x="156" y="252" width="190" height="12" rx="6" fill="#475569"/>
    
    <!-- Big UP Stylized Monogram Badge -->
    <rect x="146" y="296" width="220" height="84" rx="20" fill="url(#primaryGrad)"/>
    <text x="256" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">UP PDF</text>
  </g>
</svg>
